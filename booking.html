<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="form-page">
    <div class="form-card">
      <h1>Pendaftaran Kunjungan</h1>
      <p>Silakan isi data pengunjung.</p>

      <input id="nik" placeholder="NIK">

<input id="nama" placeholder="Nama Pengunjung">

<select id="gender">
  <option value="">Jenis Kelamin</option>
  <option value="Laki-Laki">Laki-Laki</option>
  <option value="Perempuan">Perempuan</option>
</select>

<select id="relasi">
  <option value="">Hubungan dengan WBP</option>
  <option value="Ayah">Ayah</option>
  <option value="Ibu">Ibu</option>
  <option value="Adik">Adik</option>
  <option value="Kakak">Kakak</option>
  <option value="Saudara Jauh">Saudara Jauh</option>
  <option value="Suami/Istri">Suami/Istri</option>
  <option value="Anak">Anak</option>
  <option value="Teman">Teman</option>
</select>

<div class="pengikut-group">
  <label>Pengikut</label>

  <div class="pengikut-row">
    <span>Laki-Laki</span>
    <input id="ikut_l" type="number" min="0" value="0">
  </div>

  <div class="pengikut-row">
    <span>Perempuan</span>
    <input id="ikut_p" type="number" min="0" value="0">
  </div>

  <div class="pengikut-row">
    <span>Anak-Anak</span>
    <input id="ikut_a" type="number" min="0" value="0">
  </div>
</div>

<input id="wbp" list="wbp-list" placeholder="Nama WBP">
<datalist id="wbp-list"></datalist>

      <button id="btn-daftar" class="button" onclick="booking()" disabled>Daftarkan</button>

      <canvas id="qr"></canvas>

      <a class="backlink" href="index.html">← Kembali ke dashboard</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="js/wbp-data.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
