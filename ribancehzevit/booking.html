<!DOCTYPE html>
<html>
<head>
    <title>Booking</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">Booking Kunjungan</div>

<div class="container">
    <input id="nama" placeholder="Nama">
    <input id="nik" placeholder="NIK">
    <input id="wbp" placeholder="Nama WBP">

    <select id="jam">
        <option>08:00</option>
        <option>09:00</option>
        <option>10:00</option>
    </select>

    <button class="button" onclick="booking()">Submit</button>

    <canvas id="qr"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="js/booking.js"></script>

</body>
</html>
