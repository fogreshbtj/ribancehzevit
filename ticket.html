<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiket Kunjungan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="ticket-page">
    <div class="movie-ticket">

      <div class="movie-head">
        <div class="movie-title">RIBANCEH ZEVIT</div>
        <div class="movie-subtitle">ZERO CONTACT VISIT</div>
      </div>

      <div class="ticket-strip"></div>

      <div class="movie-number" id="ticket-id"></div>

      <div class="movie-detail" id="ticket-detail"></div>

      <div class="ticket-strip"></div>

      <div class="movie-qr">
        <canvas id="ticket-qr"></canvas>
      </div>

      <a class="button" href="index.html">Kembali ke Dashboard</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="js/ticket.js"></script>
</body>
</html>
