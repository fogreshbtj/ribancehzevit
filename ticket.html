<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiket Kunjungan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="ticket-page">
    <section class="jkn-ticket">

      <div class="jkn-top">
        <div class="jkn-brand">RIBANCEH ZEVIT</div>
        <div class="jkn-sub">Zero Contact Visit</div>
      </div>

      <div class="jkn-status">TIKET KUNJUNGAN AKTIF</div>

      <div class="jkn-number" id="ticket-id"></div>

      <div class="jkn-detail" id="ticket-detail"></div>

      <div class="jkn-divider"></div>

      <div class="jkn-qr-wrap">
        <canvas id="ticket-qr"></canvas>
      </div>

      <div class="jkn-note">
        Tunjukkan tiket ini saat verifikasi kunjungan
      </div>

      <a class="button" href="index.html">Kembali ke Dashboard</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script src="js/ticket.js"></script>
</body>
</html>
